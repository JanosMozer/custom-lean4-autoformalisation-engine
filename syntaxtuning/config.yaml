# =============================================================================
# Syntax Tuning Configuration (Stage 1 SFT)
# Target: Qwen3-Coder-30B-A3B-Instruct (MoE, ~3.3B active params)
# GPU: NVIDIA RTX 5090Ti (32GB VRAM)
# Goal: Supervised fine-tuning on NL → Lean 4 formal statement translation.
# =============================================================================

run:
  project: "mesh-autoformalizer"
  entity: "mozerjanos4-budapesti-m-szaki-s-gazdas-gtudom-nyi-egyetem"
  group: "syntax-tuning"
  seed: 42

model:
  base_path: "models/base_qwen"
  # Use bfloat16 for training stability on modern GPUs; avoids fp16 overflow
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"
  # Do NOT load in 4bit here; LoRA + bf16 is cleaner for SFT quality
  load_in_4bit: true
  load_in_8bit: false

lora:
  # Target the attention & MLP projection layers for maximum plasticity
  # on the MoE model's expert routing stays frozen to preserve base capacity
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  r: 64                      # Rank: high rank for complex domain adaptation
  lora_alpha: 128            # Alpha = 2x rank is a stable default
  lora_dropout: 0.0
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  syntax_dir: "data/syntax"
  datasets:
    - "herald.jsonl"
    - "lean_workbook.jsonl"
  # Max token length. Lean 4 statements can be moderately long.
  max_seq_length: 1024
  # Proportion of data to hold out for validation
  val_split: 0.02
  # Number of DataLoader worker processes
  num_workers: 4

prompt:
  # System prompt that frames the model's autoformalization task
  system: >
    You are an expert mathematician and Lean 4 programmer. Your task is to
    translate informal mathematical statements into formal Lean 4 theorem
    statements. Output only valid Lean 4 code.

training:
  output_dir: "models/sft_checkpoints"
  num_train_epochs: 3
  # Effective batch size = per_device_batch_size * gradient_accumulation_steps
  # 2 * 16 = 32 effective batch size; fits in 32GB VRAM with LoRA + bf16
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 16
  # AdamW with weight decay; cosine schedule for smooth convergence
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  # Mixed precision: bf16 preferred for Ampere+ GPUs
  bf16: true
  fp16: false
  # Evaluation & checkpointing strategy
  eval_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  # Logging
  logging_steps: 25
  report_to: "wandb"
  # Packing short sequences together improves GPU utilization
  packing: true
  # DataCollator: train only on the completion (formal_statement)
  response_only_masking: true
