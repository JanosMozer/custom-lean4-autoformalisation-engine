run:
  project: "mesh-autoformalizer"
  entity: "entity"
  group: "syntax-tuning"
  seed: 42

model:
  base_path: "models/base_qwen"
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  load_in_4bit: true

lora:
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  r: 64
  lora_alpha: 128
  expert_target_modules:
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  expert_r: 8
  expert_alpha: 16
  lora_dropout: 0.1
  bias: "none"
  task_type: "CAUSAL_LM"
  use_dora: true          # DoRA instead of LoRA (QDoRA on the NF4 base)

data:
  syntax_dir: "data/syntax"
  datasets:
    - "herald.jsonl"
    - "lean_workbook.jsonl"
  max_seq_length: 512
  val_split: 0.01
  # Light syntax alignment: subsample instead of training on all 720k pairs.
  # Set to 0 to use the full corpus.
  max_train_samples: 40000
  num_workers: 40

prompt:
  system: >
    You are an expert mathematician and Lean 4 programmer. Your task is to
    translate informal mathematical statements into formal Lean 4 theorem
    statements. Output only valid Lean 4 code.

training:
  output_dir: "models/sft_checkpoints"
  # 1 epoch for syntax alignment; raise only if eval_loss is still falling.
  num_train_epochs: 1
  # bs=2 peaks ~26 GB (bs=4 hit 30 GB — too tight with eval + variable lengths).
  # The MoE per-expert loop is launch-bound, so batching amortizes it: bs 1->4
  # gave 3.5x throughput for ~equal wall-time. Effective batch = 2 * 8 = 16.
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 6.0e-5
  lr_scheduler_type: "cosine"
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  eval_strategy: "steps"
  eval_steps: 25
  save_strategy: "steps"
  save_steps: 25
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  logging_steps: 10
  report_to: "wandb"
  optim: "paged_adamw_8bit"
  max_steps: -1
