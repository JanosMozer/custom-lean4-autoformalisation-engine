[package]
name = "lean-engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lean-engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
regex = "1"
chrono = "0.4"
tokio-process = "0.2"
futures = "0.3.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
